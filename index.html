<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 먹을 저녁 메뉴 추천 🍽️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .result-container {
            background: #f8f9fa;
            border: 2px dashed #e9ecef;
            border-radius: 20px;
            padding: 30px 20px;
            margin-bottom: 30px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .emoji {
            font-size: 80px;
            line-height: 1;
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }

        .menu-name {
            font-size: 22px;
            font-weight: 700;
            color: #2d3436;
            min-height: 33px;
        }

        .category-tag {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 12px;
            background: #ffeaa7;
            color: #d63031;
            font-size: 12px;
            font-weight: 600;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-tag.active {
            opacity: 1;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
            color: white;
            border: none;
            padding: 18px 0;
            font-size: 18px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(214, 48, 49, 0.3);
            transition: all 0.2s ease;
            outline: none;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ff6b6b 0%, #c0392b 100%);
            box-shadow: 0 12px 24px rgba(214, 48, 49, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 5px 10px rgba(214, 48, 49, 0.3);
        }

        /* 애니메이션 효과 */
        .bounce {
            animation: bounce 0.5s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>오늘 뭐 먹지? 🤔</h1>
        <p class="subtitle">결정 장애를 위한 저녁 메뉴 랜덤 추천기</p>

        <div class="result-container">
            <div id="emoji" class="emoji">❓</div>
            <div id="menu-name" class="menu-name">버튼을 눌러보세요!</div>
            <span id="category" class="category-tag">한식</span>
        </div>

        <button class="btn" onclick="recommendMenu()">저녁 메뉴 추천</button>
    </div>

    <script>
        const menuList = [
            // 한식
            { name: "삼겹살", emoji: "🥓", category: "한식" },
            { name: "김치찌개", emoji: "🍲", category: "한식" },
            { name: "비빔밥", emoji: "🥗", category: "한식" },
            { name: "치킨", emoji: "🍗", category: "한식/야식" },
            { name: "떡볶이", emoji: "🍢", category: "분식" },
            { name: "족발/보쌈", emoji: "🍖", category: "한식" },
            { name: "갈비탕", emoji: "🥣", category: "한식" },

            // 일식
            { name: "초밥", emoji: "🍣", category: "일식" },
            { name: "라멘", emoji: "🍜", category: "일식" },
            { name: "돈가스", emoji: "🍱", category: "일식" },
            { name: "우동", emoji: "🍲", category: "일식" },

            // 양식
            { name: "피자", emoji: "🍕", category: "양식" },
            { name: "파스타", emoji: "🍝", category: "양식" },
            { name: "햄버거", emoji: "🍔", category: "양식" },
            { name: "스테이크", emoji: "🥩", category: "양식" },

            // 중식
            { name: "짜장면", emoji: "🥢", category: "중식" },
            { name: "짬뽕", emoji: "🍜", category: "중식" },
            { name: "마라탕", emoji: "🌶️", category: "중식" },
            { name: "탕수육", emoji: "🥟", category: "중식" },

            // 기타
            { name: "카레", emoji: "🍛", category: "아시안" },
            { name: "타코", emoji: "🌮", category: "멕시칸" },
            { name: "샌드위치", emoji: "🥪", category: "간편식" },
            { name: "샐러드", emoji: "🥗", category: "다이어트" }
        ];

        let isSpinning = false;

        function recommendMenu() {
            if (isSpinning) return;
            isSpinning = true;

            const emojiEl = document.getElementById('emoji');
            const menuNameEl = document.getElementById('menu-name');
            const categoryEl = document.getElementById('category');

            categoryEl.classList.remove('active');

            let counter = 0;
            const interval = setInterval(() => {
                const randomTemp = menuList[Math.floor(Math.random() * menuList.length)];
                emojiEl.textContent = randomTemp.emoji;
                menuNameEl.textContent = randomTemp.name;
                counter++;

                if (counter > 15) {
                    clearInterval(interval);
                    
                    const finalMenu = menuList[Math.floor(Math.random() * menuList.length)];
                    emojiEl.textContent = finalMenu.emoji;
                    menuNameEl.textContent = finalMenu.name;
                    categoryEl.textContent = finalMenu.category;
                    categoryEl.classList.add('active');

                    emojiEl.classList.remove('bounce');
                    void emojiEl.offsetWidth;
                    emojiEl.classList.add('bounce');

                    isSpinning = false;
                }
            }, 80);
        }
    </script>
</body>
</html>
