<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로 지각러 구출 작전 - 8:30 비상 대피소</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(18, 22, 33, 0.85);
      --panel-border: rgba(255, 42, 95, 0.25);
      --accent-red: #ff2a5f;
      --accent-yellow: #ffb703;
      --accent-green: #06d6a0;
      --accent-cyan: #00f0ff;
      --text-main: #f0f3f8;
      --text-muted: #8a99ad;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 42, 95, 0.12), transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    header {
      background: rgba(10, 13, 20, 0.95);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand i {
      color: var(--accent-red);
      font-size: 1.5rem;
      animation: pulse 1.5s infinite;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
      text-transform: uppercase;
    }

    .brand span {
      color: var(--accent-red);
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-red {
      background: rgba(255, 42, 95, 0.15);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-red:hover {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 42, 95, 0.4);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      flex: 1;
    }

    .emergency-bar {
      background: rgba(255, 42, 95, 0.08);
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: alertGlow 3s infinite alternate;
    }

    .emergency-text {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: var(--accent-red);
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-cyan);
    }

    .timer-display {
      text-align: center;
      padding: 15px 0;
    }

    .timer-clock {
      font-family: var(--font-mono);
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .timer-status {
      font-size: 0.9rem;
      margin-top: 8px;
      font-weight: 600;
    }

    .time-input-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .input-field {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
    }

    .gate-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .gate-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px;
      border-radius: 8px;
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .gate-btn.active {
      background: rgba(0, 240, 255, 0.1);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .teacher-radar {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-top: 10px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .badge-strict {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-top: 6px;
    }

    .badge-red { background: rgba(255, 42, 95, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .badge-yellow { background: rgba(255, 183, 3, 0.2); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
    .badge-green { background: rgba(6, 214, 160, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

    .excuse-box {
      background: rgba(0, 0, 0, 0.5);
      border-left: 4px solid var(--accent-cyan);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-top: 15px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #fff;
      position: relative;
    }

    .copy-excuse-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .copy-excuse-btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }

    .excel-section {
      margin-top: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 20px;
    }

    .excel-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .file-input {
      display: none;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }

    @keyframes alertGlow {
      0% { box-shadow: 0 0 5px rgba(255, 42, 95, 0.2); }
      100% { box-shadow: 0 0 20px rgba(255, 42, 95, 0.5); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <h1>프로 지각러 <span>8:30 대피소</span></h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-red" onclick="copyFullSourceCode()">
        <i class="fa-solid fa-code"></i> 코드 전체 복사
      </button>
    </div>
  </header>

  <div class="container">
    
    <div class="emergency-bar">
      <div class="emergency-text">
        <i class="fa-solid fa-bullhorn"></i>
        <span>학교 도착 마지노선: 08:30:00 (전방 50m 접근 감지 스캐너 가동 중)</span>
      </div>
      <div id="liveClock" style="font-family: var(--font-mono); font-weight: 700; color: #fff;">00:00:00</div>
    </div>

    <div class="grid-container">
      
      <!-- 골든타임 계측기 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-stopwatch"></i> 골든타임 계측기
          </div>
          <span style="font-size: 0.8rem; color: var(--text-muted);">8:30 기준</span>
        </div>
        
        <div class="timer-display">
          <div class="timer-clock" id="countdown">--:--</div>
          <div class="timer-status" id="timerStatus" style="color: var(--accent-green);">출발 시간을 입력하세요</div>
        </div>

        <div class="time-input-group">
          <input type="number" id="travelTime" class="input-field" placeholder="학교까지 소요시간(분)" value="20">
          <button class="btn btn-red" onclick="calculateGoldenTime()">계산하기</button>
        </div>
      </div>

      <!-- 교문 50m 레이더 -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-radar"></i> 교문 50m 지도교사 레이더
          </div>
          <span style="font-size: 0.8rem; color: var(--accent-red);">50% 확률 스캔</span>
        </div>

        <div class="gate-selector">
          <button class="gate-btn active" id="btnFront" onclick="selectGate('정문')">
            <i class="fa-solid fa-door-open"></i> 정문
          </button>
          <button class="gate-btn" id="btnBack" onclick="selectGate('후문')">
            <i class="fa-solid fa-door-closed"></i> 후문
          </button>
        </div>

        <div class="teacher-radar" id="radarResult">
          <i class="fa-solid fa-crosshairs" style="font-size: 2rem; color: var(--text-muted); margin-bottom: 8px;"></i>
          <p style="color: var(--text-muted); font-size: 0.85rem;">위치를 선택하면 당번 선생님이 레이더에 스캔됩니다.</p>
        </div>
      </div>

    </div>

    <!-- 맞춤형 핑계 솔루션 (선생님 이름 완전 삭제) -->
    <div class="card" style="margin-top: 20px;">
      <div class="card-header">
        <div class="card-title">
          <i class="fa-solid fa-comment-medical"></i> 맞춤형 인정 핑계 Generator
        </div>
        <span style="font-size: 0.8rem; color: var(--text-muted);">순수 핑계 대사만 출력됩니다</span>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">지각 원인</label>
          <select id="excuseReason" class="input-field" style="width: 100%;">
            <option value="sleep">단순 늦잠/알람 못 들음</option>
            <option value="bus">대중교통 배차 간격/지연</option>
            <option value="stomach">갑작스러운 복통/배탈</option>
            <option value="elevator">아파트 엘리베이터 점검</option>
            <option value="item">필수 제출 서류 두고 옴</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 4px;">선생님 성향</label>
          <select id="teacherMood" class="input-field" style="width: 100%;">
            <option value="red">🔴 빨강 (엄격함 - 솔직반성)</option>
            <option value="yellow">🟡 노랑 (보통 - 논리적 핑계)</option>
            <option value="green">🟢 초록 (유함 - 예의 바른 태도)</option>
          </select>
        </div>
      </div>

      <button class="btn btn-red" style="width: 100%; margin-top: 15px;" onclick="generateExcuse()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> 최적 인정 핑계 생성하기
      </button>

      <div class="excuse-box" id="excuseOutput">
        <button class="copy-excuse-btn" onclick="copyExcuseText()"><i class="fa-regular fa-copy"></i> 복사</button>
        <span id="excuseText">위 항목을 선택하고 버튼을 누르면 선생님 이름이 제거된 최선의 핑계 대사가 생성됩니다.</span>
      </div>
    </div>

    <!-- 엑셀 데이터 연동 -->
    <div class="excel-section">
      <div class="card-title" style="margin-bottom: 12px;">
        <i class="fa-solid fa-file-excel"></i> 당번 선생님 데이터베이스 (CSV/엑셀 연동)
      </div>
      <div class="excel-actions">
        <button class="btn" onclick="downloadCSV()">
          <i class="fa-solid fa-download"></i> 샘플 CSV 양식 다운로드
        </button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">
          <i class="fa-solid fa-upload"></i> CSV 데이터 업로드
        </button>
        <input type="file" id="fileInput" class="file-input" accept=".csv" onchange="uploadCSV(event)">
      </div>
    </div>

  </div>

  <script>
    // 선생님 기본 DB
    const teachersDB = {
      '정문': [
        { name: '권이담', location: '정문', mood: 'red', desc: '엄격함. 복장 단속 병행. 변명보다는 솔직한 사과가 통함.' },
        { name: '우단해', location: '정문', mood: 'yellow', desc: '보통임. 명확하고 논리적인 외부 이유 제시 시 납득하심.' }
      ],
      '후문': [
        { name: '류지구', location: '후문', mood: 'red', desc: '엄격함. 정직한 반성 모드 필수.' },
        { name: '박하나', location: '후문', mood: 'green', desc: '엄격하지 않음. 정직하게 사과하면 부드럽게 넘어감.' }
      ]
    };

    let selectedGate = '정문';

    // 실시간 시계
    setInterval(() => {
      const now = new Date();
      document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    // 골든타임 계산
    function calculateGoldenTime() {
      const travelTime = parseInt(document.getElementById('travelTime').value) || 0;
      const targetTime = new Date();
      targetTime.setHours(8, 30, 0, 0);

      const deadline = new Date(targetTime.getTime() - travelTime * 60000);
      const hours = String(deadline.getHours()).padStart(2, '0');
      const minutes = String(deadline.getMinutes()).padStart(2, '0');

      document.getElementById('countdown').innerText = `${hours}:${minutes}`;
      
      const now = new Date();
      if (now > deadline) {
        document.getElementById('timerStatus').innerText = "🚨 골든타임 초과! 지금 즉시 출발해야 합니다!";
        document.getElementById('timerStatus').style.color = "var(--accent-red)";
      } else {
        document.getElementById('timerStatus').innerText = `최대 ${hours}시 ${minutes}분까지는 집에서 나와야 합니다.`;
        document.getElementById('timerStatus').style.color = "var(--accent-green)";
      }
    }

    // 교문 선택 및 선생님 50% 랜덤 지정
    function selectGate(gate) {
      selectedGate = gate;
      document.getElementById('btnFront').classList.toggle('active', gate === '정문');
      document.getElementById('btnBack').classList.toggle('active', gate === '후문');

      const list = teachersDB[gate];
      const randomIndex = Math.floor(Math.random() * list.length);
      const teacher = list[randomIndex];

      let badgeHtml = '';
      if (teacher.mood === 'red') {
        badgeHtml = `<span class="badge-strict badge-red">🔴 빨강 (엄격함)</span>`;
        document.getElementById('teacherMood').value = 'red';
      } else if (teacher.mood === 'yellow') {
        badgeHtml = `<span class="badge-strict badge-yellow">🟡 노랑 (보통)</span>`;
        document.getElementById('teacherMood').value = 'yellow';
      } else {
        badgeHtml = `<span class="badge-strict badge-green">🟢 초록 (유함)</span>`;
        document.getElementById('teacherMood').value = 'green';
      }

      document.getElementById('radarResult').innerHTML = `
        <div style="font-size: 1.2rem; font-weight: 800; color: #fff;">${teacher.name} 선생님</div>
        <div style="margin: 4px 0;">${badgeHtml}</div>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 6px;">${teacher.desc}</p>
      `;
    }

    // 순수 핑계 대사 생성 (선생님 이름 완전 제외)
    function generateExcuse() {
      const reason = document.getElementById('excuseReason').value;
      const mood = document.getElementById('teacherMood').value;

      let text = "";

      if (mood === 'red') {
        // 엄격함 -> 정직 + 확실한 반성 대사
        if (reason === 'sleep') text = "어제 과제를 마치고 늦게 자는 바람에 알람 소리를 듣지 못했습니다. 제 관리 소홀입니다. 정말 죄송합니다!";
        else if (reason === 'bus') text = "오늘 버스를 놓쳐 지각했습니다. 제 계산 착오입니다. 다음부터는 10분 일찍 나와 기다리겠습니다.";
        else if (reason === 'stomach') text = "아침에 갑자기 복통이 심해 지체되었습니다. 몸 관리를 제대로 못 해 죄송합니다.";
        else text = "지각하여 정말 죄송합니다. 어떠한 이유든 제 부주의이며 앞으로 다시는 늦지 않도록 하겠습니다.";
      } else if (mood === 'yellow') {
        // 보통 -> 논리적 외부 변수 설명 대사
        if (reason === 'bus') text = "평소 타던 버스가 배차 간격 문제로 오지 않아 다음 버스를 탔는데 승객이 많아 정차 시간이 길어졌습니다. 죄송합니다.";
        else if (reason === 'stomach') text = "집에서 출발하려는데 갑자기 급성 복통이 와서 화장실에 들르느라 늦었습니다.";
        else if (reason === 'elevator') text = "아파트 엘리베이터 점검으로 계단을 내려오느라 시간이 지체되었습니다. 죄송합니다.";
        else if (reason === 'item') text = "학교 제출 서류를 집에 두고 와서 중간에 다시 돌아갔다 오느라 늦었습니다.";
        else text = "오늘 출발 직전에 예상치 못한 변수가 생겨 늦었습니다. 다음부터는 여유 있게 나오겠습니다.";
      } else {
        // 유함 -> 예의 바르고 싹싹한 대사
        if (reason === 'sleep') text = "오늘 알람 소리를 못 들어서 늦었습니다! 늦지 않으려고 교문에서부터 정말 열심히 뛰어왔습니다. 죄송합니다!";
        else if (reason === 'bus') text = "버스가 조금 늦게 도착해서 급하게 뛰어왔습니다! 다음에는 더 일찍 나오겠습니다.";
        else text = "죄송합니다! 급하게 준비해서 뛰어왔는데 조금 늦었습니다. 다음엔 꼭 시간 맞춰 오겠습니다!";
      }

      document.getElementById('excuseText').innerText = `"${text}"`;
    }

    // 핑계 텍스트 복사
    function copyExcuseText() {
      const text = document.getElementById('excuseText').innerText;
      navigator.clipboard.writeText(text);
      alert('핑계 대사가 클립보드에 복사되었습니다!');
    }

    // 전체 소스코드 복사
    function copyFullSourceCode() {
      const fullCode = document.documentElement.outerHTML;
      navigator.clipboard.writeText(fullCode).then(() => {
        alert('이 웹페이지의 전체 HTML 소스코드가 복사되었습니다!');
      });
    }

    // CSV 다운로드
    function downloadCSV() {
      const csvContent = "data:text/csv;charset=utf-8," 
        + "선생님 성함,담당 위치,성향 등급,특이사항\n"
        + "권이담,정문,엄격함,복장 단속 병행\n"
        + "우단해,정문,보통,논리적 사유 필요\n"
        + "류지구,후문,엄격함,솔직 반성 필수\n"
        + "박하나,후문,유함,친절하게 인사할 것";
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "teacher_schedule.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // CSV 업로드 처리
    function uploadCSV(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        alert('CSV 선생님 데이터가 정상적으로 업로드되었습니다.');
        selectGate(selectedGate);
      };
      reader.readAsText(file);
    }

    // 초기화 실행
    selectGate('정문');
    calculateGoldenTime();
  </script>
</body>
</html>
